# Núcleo CRM — sobe o app e conecta no seu Postgres (nucleodb).
# Os valores abaixo vêm de um arquivo .env ao lado deste (o docker compose lê
# automaticamente) ou das variáveis do painel (Easypanel).
#
#   docker compose up -d --build
#
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-0}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_CSRF_ORIGINS=${DJANGO_CSRF_ORIGINS:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}

