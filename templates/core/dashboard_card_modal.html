{{ options|json_script:"card-opts" }}
<div class="modal modal--wide card-builder-modal"
     x-data="{
       opts: JSON.parse(document.getElementById('card-opts').textContent),
       obj: '{{ card.object_type|default:'deal' }}',
       metric: '{{ card.metric|default:'count' }}',
       chart: '{{ card.chart|default:'kpi' }}',
       valueField: '{{ card.value_field }}',
       groupBy: '{{ card.group_by }}',
       get spec() { return this.opts[this.obj] || {}; },
       get numberFields() { return this.spec.number_fields || []; },
       get groups() { return this.spec.groups || []; },
       get stageOptions() { return this.spec.stage_options || []; },
       get hasDone() { return this.spec.has_done; },
       get grouped() { return ['bar','pie','line'].includes(this.chart); }
     }">
  <div class="modal__head">
    <div>
      <h2>{% if card.pk %}Editar card{% else %}Novo card{% endif %}</h2>
      <p class="modal__subtitle">Escolha o que medir e como mostrar — a prévia atualiza sozinha.</p>
    </div>
    <button type="button" class="icon-btn" @click="modal = false">{% include "core/_icon.html" with icon="close" %}</button>
  </div>

  <div class="modal__body cbm">
    <form class="cbm__form"
          hx-post="{% if card.pk %}{% url 'dashboard_card_edit' card.pk %}{% else %}{% url 'dashboard_card_new' %}{% endif %}"
          hx-swap="none">
      {% csrf_token %}

      <label class="cbm__label">Título do card</label>
      <input type="text" name="title" value="{{ card.title }}" class="cbm__input" placeholder="Ex.: Negócios por etapa" maxlength="120" required>

      <label class="cbm__label">O que medir</label>
      <div class="cbm__row">
        <select name="object_type" x-model="obj" class="cbm__select">
          {% for value, label in object_choices %}<option value="{{ value }}" {% if value == card.object_type %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
        <select name="metric" x-model="metric" class="cbm__select">
          {% for value, label in metric_choices %}<option value="{{ value }}" {% if value == card.metric %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>

      <template x-if="metric !== 'count'">
        <div>
          <label class="cbm__label">Campo (soma/média)</label>
          <select name="value_field" x-model="valueField" class="cbm__select cbm__select--full">
            <option value="">—</option>
            <template x-for="f in numberFields" :key="f.key"><option :value="f.key" x-text="f.label"></option></template>
          </select>
          <span class="cbm__hint" x-show="numberFields.length === 0">Este objeto não tem campo numérico — use Contagem.</span>
        </div>
      </template>

      <label class="cbm__label">Como mostrar</label>
      <select name="chart" x-model="chart" class="cbm__select cbm__select--full">
        {% for value, label in chart_choices %}<option value="{{ value }}" {% if value == card.chart %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>

      <template x-if="grouped">
        <div>
          <label class="cbm__label">Agrupar por</label>
          <select name="group_by" x-model="groupBy" class="cbm__select cbm__select--full">
            <option value="">—</option>
            <template x-for="g in groups" :key="g.key"><option :value="g.key" x-text="g.label"></option></template>
          </select>
        </div>
      </template>

      <label class="cbm__label">Filtros</label>
      <div class="cbm__row cbm__row--wrap">
        <select name="period" class="cbm__select">
          {% for value, label in period_choices %}<option value="{{ value }}" {% if value == card.filters.period %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
        <template x-if="stageOptions.length">
          <select name="stage" class="cbm__select">
            <option value="">Todas as etapas</option>
            <template x-for="s in stageOptions" :key="s.key"><option :value="s.key" x-text="s.label" :selected="s.key === '{{ card.filters.stage }}'"></option></template>
          </select>
        </template>
        <template x-if="hasDone">
          <select name="done" class="cbm__select">
            <option value="">Todas</option>
            <option value="0" {% if card.filters.done == '0' %}selected{% endif %}>Pendentes</option>
            <option value="1" {% if card.filters.done == '1' %}selected{% endif %}>Concluídas</option>
          </select>
        </template>
      </div>

      <button type="button" class="cbm__refresh"
              hx-post="{% url 'dashboard_card_preview' %}" hx-include="closest form" hx-target="#card-preview"
              hx-trigger="load, click, change from:closest form delay:200ms, keyup from:closest form delay:400ms">
        {% include "core/_icon.html" with icon="sliders" %} Atualizar prévia
      </button>

      <div class="cbm__actions">
        <button class="btn btn--primary" type="submit">Salvar card</button>
        <button type="button" class="btn btn--ghost" @click="modal = false">Cancelar</button>
      </div>
    </form>

    <div class="cbm__preview">
      <div class="cbm__preview-label">Prévia</div>
      <div id="card-preview" class="dash-stack"></div>
    </div>
  </div>
</div>
