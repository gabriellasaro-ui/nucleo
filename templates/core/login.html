{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Núcleo</title>
  <link rel="stylesheet" href="{% static 'css/nucleo.css' %}">
</head>
<body>
  <div class="auth">
    <form class="auth__card" method="post">
      {% csrf_token %}
      <div class="auth__brand"><span class="brand-mark">N</span> Núcleo</div>
      <p class="sub">Entre no seu workspace.</p>

      {% if form.errors %}
      <div class="auth__error">Usuário ou senha inválidos.</div>
      {% endif %}

      <div class="field">
        <label for="id_username">Usuário</label>
        <input type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="field">
        <label for="id_password">Senha</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn--primary">Entrar</button>
    </form>
  </div>
</body>
</html>
